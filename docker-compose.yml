services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: meteohealth_user
      POSTGRES_PASSWORD: Solovandr_09
      POSTGRES_DB: meteohealth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: meteohealth_user
      DB_PASSWORD: Solovandr_09
      DB_NAME: meteohealth
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecretkey123
      DEBUG: "True"
    depends_on:
      - postgres
      - redis
    command: sh -c "uv run alembic upgrade head && uv run uvicorn src.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: meteohealth_user
      DB_PASSWORD: Solovandr_09
      DB_NAME: meteohealth
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: supersecretkey123
      DEBUG: "False"
    depends_on:
      - postgres
      - redis
    command: uv run faststream run src.workers.app:app

volumes:
  postgres_data:
